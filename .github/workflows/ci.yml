name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # laravel/framework ^13.0 itself requires PHP ^8.3 -- there's no lower
      # version to matrix against.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test
      # Larastan on this codebase needs more than PHPStan's 128M default.
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - run: cp .env.example .env
      - run: php artisan key:generate

      # phpunit.xml points DB_DATABASE at this file (not :memory:) because
      # migrations run here, as a separate process, before `artisan test`
      # starts a new one -- :memory: doesn't survive across that boundary.
      # It also has to exist before `artisan migrate` runs the same way it
      # would need to before pointing any tool at a fresh sqlite file.
      - run: touch database/testing.sqlite
      - name: Run migrations against the sqlite test database
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite

      - run: php artisan test
